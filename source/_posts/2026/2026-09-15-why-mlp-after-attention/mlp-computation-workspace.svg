    <path d="M 466 370 H 734" />
    <path d="M 466 390 H 734" />
    <path d="M 466 410 H 734" />
  </g>

  <!-- Every shown activation component contributes to the shown update components. -->
  <g class="projection" aria-label="Down Projection 的加权组合">
    <path d="M 766 190 C 870 190, 970 272, 1075 272" />
    <path d="M 766 190 C 870 190, 970 300, 1075 300" />
    <path d="M 766 190 C 870 190, 970 328, 1075 328" />
    <path d="M 766 210 C 870 210, 970 272, 1075 272" />
    <path d="M 766 210 C 870 210, 970 300, 1075 300" />
    <path d="M 766 210 C 870 210, 970 328, 1075 328" />
    <path d="M 766 230 C 870 230, 970 272, 1075 272" />
    <path d="M 766 230 C 870 230, 970 300, 1075 300" />
    <path d="M 766 230 C 870 230, 970 328, 1075 328" />
    <path d="M 766 250 C 870 250, 970 272, 1075 272" />
    <path d="M 766 250 C 870 250, 970 300, 1075 300" />
    <path d="M 766 250 C 870 250, 970 328, 1075 328" />
    <path d="M 766 270 C 870 270, 970 272, 1075 272" />
    <path d="M 766 270 C 870 270, 970 300, 1075 300" />
    <path d="M 766 270 C 870 270, 970 328, 1075 328" />
    <path d="M 766 290 C 870 290, 970 272, 1075 272" />
    <path d="M 766 290 C 870 290, 970 300, 1075 300" />
    <path d="M 766 290 C 870 290, 970 328, 1075 328" />
    <path d="M 766 310 C 870 310, 970 272, 1075 272" />
    <path d="M 766 310 C 870 310, 970 300, 1075 300" />
    <path d="M 766 310 C 870 310, 970 328, 1075 328" />
    <path d="M 766 330 C 870 330, 970 272, 1075 272" />
    <path d="M 766 330 C 870 330, 970 300, 1075 300" />
    <path d="M 766 330 C 870 330, 970 328, 1075 328" />
    <path d="M 766 350 C 870 350, 970 272, 1075 272" />
    <path d="M 766 350 C 870 350, 970 300, 1075 300" />
    <path d="M 766 350 C 870 350, 970 328, 1075 328" />
    <path d="M 766 370 C 870 370, 970 272, 1075 272" />
    <path d="M 766 370 C 870 370, 970 300, 1075 300" />
    <path d="M 766 370 C 870 370, 970 328, 1075 328" />
    <path d="M 766 390 C 870 390, 970 272, 1075 272" />
    <path d="M 766 390 C 870 390, 970 300, 1075 300" />
    <path d="M 766 390 C 870 390, 970 328, 1075 328" />
    <path d="M 766 410 C 870 410, 970 272, 1075 272" />
    <path d="M 766 410 C 870 410, 970 300, 1075 300" />
    <path d="M 766 410 C 870 410, 970 328, 1075 328" />
  </g>

  <g aria-label="经过 LayerNorm 的 768 维输入，仅示意三个分量">
    <circle class="vector-node" cx="110" cy="272" r="9" />
    <circle class="vector-node" cx="110" cy="300" r="9" />
    <circle class="vector-node" cx="110" cy="328" r="9" />
  </g>
  <g aria-label="768 维 MLP 更新，仅示意三个分量">
    <circle class="vector-node" cx="1090" cy="272" r="9" />
    <circle class="vector-node" cx="1090" cy="300" r="9" />
    <circle class="vector-node" cx="1090" cy="328" r="9" />
  </g>

  <g aria-label="隐藏层激活前的 3072 个中间值，仅示意十二个分量">
    <circle cx="450" cy="190" r="8" fill="#497fb9" fill-opacity="0.7" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="450" cy="210" r="8" fill="#497fb9" fill-opacity="0.3" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="450" cy="230" r="8" fill="#497fb9" fill-opacity="0.4" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="450" cy="250" r="8" fill="#497fb9" fill-opacity="0.8" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="450" cy="270" r="8" fill="#497fb9" fill-opacity="0.6" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="450" cy="290" r="8" fill="#497fb9" fill-opacity="0.5" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="450" cy="310" r="8" fill="#497fb9" fill-opacity="0.2" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="450" cy="330" r="8" fill="#497fb9" fill-opacity="1" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="450" cy="350" r="8" fill="#497fb9" fill-opacity="0.25" stroke="#497fb9" stroke-width="1.5" />
