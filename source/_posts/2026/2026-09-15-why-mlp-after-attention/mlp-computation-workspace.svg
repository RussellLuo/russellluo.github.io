    <circle cx="450" cy="390" r="8" fill="#497fb9" fill-opacity="0.65" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="450" cy="410" r="8" fill="#497fb9" fill-opacity="0.35" stroke="#497fb9" stroke-width="1.5" />
  </g>
  <g aria-label="隐藏层激活后的 3072 维输出，分量数量保持不变">
    <circle cx="750" cy="190" r="8" fill="#497fb9" fill-opacity="0.12" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="750" cy="210" r="8" fill="#497fb9" fill-opacity="0.21" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="750" cy="230" r="8" fill="#497fb9" fill-opacity="0.15" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="750" cy="250" r="8" fill="#497fb9" fill-opacity="0.8" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="750" cy="270" r="8" fill="#497fb9" fill-opacity="0.13" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="750" cy="290" r="8" fill="#497fb9" fill-opacity="0.4" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="750" cy="310" r="8" fill="#497fb9" fill-opacity="0.12" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="750" cy="330" r="8" fill="#497fb9" fill-opacity="1" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="750" cy="350" r="8" fill="#497fb9" fill-opacity="0.16" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="750" cy="370" r="8" fill="#497fb9" fill-opacity="0.12" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="750" cy="390" r="8" fill="#497fb9" fill-opacity="0.62" stroke="#497fb9" stroke-width="1.5" />
    <circle cx="750" cy="410" r="8" fill="#497fb9" fill-opacity="0.13" stroke="#497fb9" stroke-width="1.5" />
  </g>

  <text class="data-label" x="110" y="445">归一化输入</text>
  <text class="dimension" x="110" y="470">768 维</text>
  <text class="data-label" x="450" y="445">激活前</text>
  <text class="dimension" x="450" y="470">3072 维</text>
  <text class="data-label" x="750" y="445">激活后</text>
  <text class="dimension" x="750" y="470">3072 维</text>
  <text class="data-label" x="1090" y="445">MLP 更新</text>
  <text class="dimension" x="1090" y="470">768 维</text>
</svg>
