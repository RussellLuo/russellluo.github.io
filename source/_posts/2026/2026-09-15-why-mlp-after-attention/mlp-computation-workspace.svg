<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="415" viewBox="0 90 1200 415" role="img" aria-labelledby="title desc">
  <title id="title">GPT-2 MLP 的扩展、非线性与再组合</title>
  <desc id="desc">以单个 Token 位置为例，MLP 接收经过 LayerNorm 的 768 维输入。Up Projection 将输入加权组合并加上偏置，得到 3072 个中间值；GELU 逐元素进行非线性变换，维度仍为 3072；Down Projection 将变换后的结果加权组合并加上偏置，生成 768 维 MLP 更新。两列 3072 维向量分别表示同一个隐藏层激活前后的数值。圆点表示向量分量，数量和连线仅作示意；颜色变化用于示意 GELU 前后各分量数值的变化。</desc>
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #171717;
      }
      .operation { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .explanation { font-size: 17px; fill: #666666; text-anchor: middle; }
      .data-label { font-size: 18px; font-weight: 650; text-anchor: middle; }
      .dimension { font-size: 18px; font-weight: 650; fill: #555555; text-anchor: middle; }
      .vector-node { fill: #e6e6e2; stroke: #666666; stroke-width: 1.8; }
      .projection { fill: none; stroke: #aab5c0; stroke-width: 1.25; stroke-opacity: 0.55; }
      .element-arrow { fill: none; stroke: #9bafc4; stroke-width: 1.4; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9bafc4" />
    </marker>
  </defs>

  <rect y="90" width="1200" height="415" fill="#fcfcfb" />

  <text class="operation" x="320" y="132">Up Projection</text>
  <text class="explanation" x="320" y="157">加权组合</text>
  <text class="operation" x="600" y="132">GELU</text>
  <text class="explanation" x="600" y="157">逐元素非线性变换</text>
  <text class="operation" x="894" y="132">Down Projection</text>
  <text class="explanation" x="894" y="157">加权组合</text>

  <!-- All shown input components contribute to every shown intermediate component. -->
  <g class="projection" aria-label="Up Projection 的加权组合">
    <path d="M 125 272 C 230 272, 330 190, 434 190" />
    <path d="M 125 272 C 230 272, 330 210, 434 210" />
    <path d="M 125 272 C 230 272, 330 230, 434 230" />
    <path d="M 125 272 C 230 272, 330 250, 434 250" />
    <path d="M 125 272 C 230 272, 330 270, 434 270" />
    <path d="M 125 272 C 230 272, 330 290, 434 290" />
    <path d="M 125 272 C 230 272, 330 310, 434 310" />
    <path d="M 125 272 C 230 272, 330 330, 434 330" />
    <path d="M 125 272 C 230 272, 330 350, 434 350" />
    <path d="M 125 272 C 230 272, 330 370, 434 370" />
    <path d="M 125 272 C 230 272, 330 390, 434 390" />
    <path d="M 125 272 C 230 272, 330 410, 434 410" />
    <path d="M 125 300 C 230 300, 330 190, 434 190" />
    <path d="M 125 300 C 230 300, 330 210, 434 210" />
    <path d="M 125 300 C 230 300, 330 230, 434 230" />
    <path d="M 125 300 C 230 300, 330 250, 434 250" />
    <path d="M 125 300 C 230 300, 330 270, 434 270" />
    <path d="M 125 300 C 230 300, 330 290, 434 290" />
    <path d="M 125 300 C 230 300, 330 310, 434 310" />
    <path d="M 125 300 C 230 300, 330 330, 434 330" />
    <path d="M 125 300 C 230 300, 330 350, 434 350" />
    <path d="M 125 300 C 230 300, 330 370, 434 370" />
    <path d="M 125 300 C 230 300, 330 390, 434 390" />
    <path d="M 125 300 C 230 300, 330 410, 434 410" />
    <path d="M 125 328 C 230 328, 330 190, 434 190" />
    <path d="M 125 328 C 230 328, 330 210, 434 210" />
    <path d="M 125 328 C 230 328, 330 230, 434 230" />
    <path d="M 125 328 C 230 328, 330 250, 434 250" />
    <path d="M 125 328 C 230 328, 330 270, 434 270" />
    <path d="M 125 328 C 230 328, 330 290, 434 290" />
    <path d="M 125 328 C 230 328, 330 310, 434 310" />
    <path d="M 125 328 C 230 328, 330 330, 434 330" />
    <path d="M 125 328 C 230 328, 330 350, 434 350" />
    <path d="M 125 328 C 230 328, 330 370, 434 370" />
    <path d="M 125 328 C 230 328, 330 390, 434 390" />
    <path d="M 125 328 C 230 328, 330 410, 434 410" />
  </g>

  <!-- GELU maps each component to one output component without changing width. -->
  <g class="element-arrow" aria-label="GELU 逐元素变换">
    <path d="M 466 190 H 734" />
    <path d="M 466 210 H 734" />
    <path d="M 466 230 H 734" />
    <path d="M 466 250 H 734" />
    <path d="M 466 270 H 734" />
    <path d="M 466 290 H 734" />
